[workspace]
resolver = "2"
members = [
    "crates/pycellchat-core",
    "crates/pycellchat-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pycellchat/pycellchat"

[workspace.dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
sprs = "0.11"
petgraph = "0.7"
rayon = "1.10"
rand = "0.8"
rand_chacha = "0.3"
numpy = "0.22"
pyo3 = { version = "0.22", features = ["extension-module"] }
