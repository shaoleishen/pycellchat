[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pycellchat"
version = "0.1.0"
description = "Cell-cell communication inference with Rust-powered computation, native AnnData/Scanpy compatibility"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.10",
    "scanpy>=1.9",
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
spatial = ["squidpy>=1.3"]
gpu = ["cupy>=12.0", "cuml>=23.0"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]
full = ["pycellchat[spatial,dev]"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "pycellchat._core"
manifest-path = "crates/pycellchat-py/Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
